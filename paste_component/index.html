<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0; padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  #zone {
    border: 2px dashed #6366f1;
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    color: #4338ca;
    background: #eef2ff;
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s;
    outline: none;
  }
  #zone:hover { background: #e0e7ff; }
  #zone.drag { background: #c7d2fe; border-color: #4338ca; }
  #status { color: #059669; font-size: 0.78rem; margin-top: 4px; min-height: 1em; }
</style>
</head>
<body>
  <div id="zone" tabindex="0">
    📋 <b>Click here, then press Ctrl+V</b> (⌘+V on Mac)<br/>
    <span style="font-size:0.75rem;color:#6366f1;">…or drag &amp; drop an image</span>
    <div id="status"></div>
  </div>
<script>
(function() {
  const zone = document.getElementById('zone');
  const status = document.getElementById('status');

  function sendToStreamlit(dataUrl) {
    // Custom components get a Streamlit RPC bridge auto-injected
    if (window.Streamlit && window.Streamlit.setComponentValue) {
      window.Streamlit.setComponentValue(dataUrl);
    } else {
      window.parent.postMessage({
        isStreamlitMessage: true,
        type: "streamlit:setComponentValue",
        value: dataUrl,
        dataType: "string"
      }, "*");
    }
  }

  function handleImageFile(file) {
    if (!file || !file.type || file.type.indexOf('image') !== 0) return false;
    const reader = new FileReader();
    reader.onload = function(ev) {
      status.textContent = "✓ Image loaded (" + Math.round(file.size/1024) + " KB)";
      sendToStreamlit(ev.target.result);
    };
    reader.readAsDataURL(file);
    return true;
  }

  function onPaste(e) {
    const items = (e.clipboardData || window.clipboardData || {}).items || [];
    for (const item of items) {
      if (item.kind === 'file' && item.type.indexOf('image') === 0) {
        const file = item.getAsFile();
        if (handleImageFile(file)) {
          e.preventDefault();
          return;
        }
      }
    }
    status.textContent = "No image found in clipboard.";
  }

  zone.addEventListener('paste', onPaste);
  document.addEventListener('paste', onPaste);
  zone.addEventListener('click', () => { zone.focus(); status.textContent = "Ready — press Ctrl+V"; });
  zone.addEventListener('keydown', (e) => { if (e.key === 'v' && (e.ctrlKey || e.metaKey)) status.textContent = "Pasting…"; });

  // Drag & drop
  ['dragenter','dragover'].forEach(ev => zone.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation(); zone.classList.add('drag');
  }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, (e) => {
    e.preventDefault(); e.stopPropagation(); zone.classList.remove('drag');
  }));
  zone.addEventListener('drop', (e) => {
    const files = e.dataTransfer.files;
    if (files && files.length) handleImageFile(files[0]);
  });

  // Tell Streamlit we're ready
  if (window.Streamlit && window.Streamlit.setFrameHeight) {
    window.Streamlit.setFrameHeight(90);
  }
})();
</script>
</body>
</html>
